# CI for the ThinkPad NixOS config — tiers 3-4 of TESTING.md.
# Runs on native x86_64 runners, so no cross-compilation/emulation games:
# the exact target architecture builds and boots here.
#
# The private/ layer is absent in CI by design; everything targets the
# thinkpad-ci variant, which substitutes tracked fixtures (checks/fixtures/).
name: checks

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # One-shot bootstrap: if the repo has no flake.lock, generate one and push
  # it back so every subsequent run (and the ThinkPad deploy) pins the exact
  # same nixpkgs revision. Idempotent — exits immediately once the lock
  # exists. Skipped on PRs (no pushing to PR branches). Note: the push uses
  # GITHUB_TOKEN, which deliberately does NOT trigger a recursive workflow
  # run; the pinned state is exercised from the next real push onward.
  # Updating the pin later is a deliberate act: nix flake update + commit.
  ensure-lock:
    name: "pin: ensure flake.lock exists"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Generate and commit flake.lock if missing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -f flake.lock ]; then
            echo "flake.lock present — nixpkgs is pinned, nothing to do"
            exit 0
          fi
          nix flake lock
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "flake: pin nixpkgs (lock generated by CI)"
          git push

  eval-and-lint:
    name: "tiers 1-2: lint + evaluate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Lint (statix + deadnix)
        run: ./check.sh lint
      - name: Evaluate thinkpad-ci
        run: ./check.sh ci-eval --show-trace

  build:
    name: "tier 3: build x86_64 system"
    needs: eval-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Build full system closure (thinkpad-ci)
        run: |
          nix build -L \
            .#nixosConfigurations.thinkpad-ci.config.system.build.toplevel
      - name: Report closure size
        run: nix path-info -Sh ./result | tail -n1

  vm-boot-test:
    name: "tier 4: QEMU boot test"
    needs: eval-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Enable KVM on the runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Boot the system in QEMU, assert services
        run: nix build -L .#checks.x86_64-linux.boot
