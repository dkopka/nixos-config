# ── 1. Prefix ────────────────────────────────────────────────────────────────

unbind C-b
set  -g prefix C-a
bind    C-a send-prefix

# ── 2. Terminal / true colour ────────────────────────────────────────────────

# default-terminal must be set for the RGB capability to attach to anything
# useful; without it the override lands on "screen" and truecolour silently
# does not work.

set -g default-terminal "tmux-256color"

# tmux >= 3.2 (preferred):
set -as terminal-features ",xterm*:RGB"

# tmux <  3.2 — comment the line above, uncomment this one instead:
# set -as terminal-overrides ",xterm*:Tc"


# ── 3. Windows & panes ───────────────────────────────────────────────────────

set  -g base-index 0          # 0 is the tmux default; explicit for clarity
setw -g pane-base-index 0     # ditto (was set twice in the old config)
set  -g renumber-windows on

# Two separate things, both needed to keep window names stable:
setw -g automatic-rename off  # tmux renaming the window from the running command
set  -g allow-rename off      # the application renaming it via escape sequence


# ── 4. Copy mode ─────────────────────────────────────────────────────────────
# Required. Without it tmux derives the copy table from $EDITOR/$VISUAL, and
# the copy-mode-vi bindings in section 5 are never reachable.

setw -g mode-keys vi


# ── 5. vim-tmux-navigator ────────────────────────────────────────────────────
# https://github.com/christoomey/vim-tmux-navigator
# Smart pane switching that hands C-h/j/k/l through to Vim when Vim is the
# foreground process in the pane.

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# C-\ needs an extra level of escaping on tmux >= 3.0. Version test uses cut
# rather than bc, which is frequently not installed (and made this whole
# block fail silently).
if-shell -b '[ "$(tmux -V | cut -d" " -f2 | cut -d. -f1)" -lt 3 ]' \
    "bind -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'   'select-pane -l'"
if-shell -b '[ "$(tmux -V | cut -d" " -f2 | cut -d. -f1)" -ge 3 ]' \
    "bind -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\' 'select-pane -l'"

bind -T copy-mode-vi 'C-h'  select-pane -L
bind -T copy-mode-vi 'C-j'  select-pane -D
bind -T copy-mode-vi 'C-k'  select-pane -U
bind -T copy-mode-vi 'C-l'  select-pane -R
bind -T copy-mode-vi 'C-\'  select-pane -l


# ── 6. Status line ───────────────────────────────────────────────────────────
# Base style unified on colour237 — the old config set status-bg to colour236
# while the left/right formats hardcoded colour237/239.
# NOTE: the  glyphs need a Nerd Font / patched font in your terminal.

set -g status-style        'bg=colour237,fg=colour248'
set -g message-style       'fg=colour2,bg=colour0,bold'
set -g window-status-style 'fg=colour32'
set -g window-status-format '  [#I] #[fg=colour7]#W #[fg=colour32]#F  '

set -g status-left "\
#[fg=colour7,bg=colour241]#{?client_prefix,#[bg=colour167],} #S \
#[fg=colour241,bg=colour237]#{?client_prefix,#[fg=colour167],}#{?window_zoomed_flag, 🔍,} "
set -g status-left-length 48

# gitmux merged in here. It used to be a second, separate status-right further
# down the file, which silently discarded everything below.
set -g status-right "\
#[fg=colour248,bg=colour237] #(gitmux \"#{pane_current_path}\") \
#[fg=colour109,bg=colour237]  \
#[fg=colour214,bg=colour237] %d/%m/%y\
#[fg=colour109]  \
#[fg=colour214] %H:%M "
set -g status-right-length 150

set -g status-interval 5


# ── 7. Plugins (TPM) ─────────────────────────────────────────────────────────
# Install TPM first:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Then press  prefix + I  to fetch plugins.
#
# @plugin declarations MUST come before the run line. The old config had the
# declaration but no run line, so no plugin was ever loaded.

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'dreamsofcode-io/catppuccin-tmux'   # conflicts with section 6

run '~/.tmux/plugins/tpm/tpm'
